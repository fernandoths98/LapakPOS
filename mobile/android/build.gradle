buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Some third-party native modules (e.g. react-native-bluetooth-classic) reference their
// own generated BuildConfig class (e.g. BuildConfig.DEBUG) without opting into
// buildFeatures.buildConfig themselves, assuming AGP's old default of generating it
// automatically for every module. AGP 8 turned that default off, and AGP 9 (used here)
// removed the project-wide android.defaults.buildfeatures.buildconfig escape hatch
// entirely — the only way left to fix this is per-module. Force it on for every Android
// subproject (:app itself plus every autolinked native library module under
// node_modules) here instead of patching node_modules directly, which a reinstall
// would undo anyway.
subprojects { subproject ->
    ["com.android.library", "com.android.application"].each { pluginId ->
        subproject.plugins.withId(pluginId) {
            subproject.android.buildFeatures.buildConfig = true
        }
    }
}
